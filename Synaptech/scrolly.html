<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#020408;color:#F0F4FF;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
:root{
  --bg:#020408;--surface:#060C14;
  --accent:#7C3AED;--accent-mid:#9F67FF;--accent-light:#C4B5FD;
  --cyan:#06B6D4;--cyan-light:#67E8F9;
  --green:#22c55e;--text:#F0F4FF;--muted:#8B9EC7;--dim:#3A4A6A;
  --border:rgba(124,58,237,0.2);
}
#scroll-root{height:100vh;overflow-y:scroll;scroll-behavior:smooth;position:relative}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#020408}::-webkit-scrollbar-thumb{background:#7C3AED;border-radius:2px}

/* PROGRESS */
#progress-bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#7C3AED,#06B6D4);width:0%;z-index:200;transition:width .08s linear}

/* HEADER */
#header{position:fixed;top:0;right:0;z-index:150;padding:.7rem 1.5rem;display:flex;gap:.45rem;transition:transform .4s ease}
.lang-btn{background:rgba(2,4,8,.7);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:.28rem .75rem;font-size:.7rem;cursor:pointer;font-family:'Inter',sans-serif;font-weight:400;transition:all .2s;backdrop-filter:blur(8px)}
.lang-btn.active{background:rgba(124,58,237,.2);border-color:rgba(124,58,237,.4);color:var(--accent-light);font-weight:600}

/* SCENES */
.scene-track{position:relative;height:200vh}
.scene-track.tall{height:250vh}
.scene-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}

/* CANVAS */
canvas{display:block}
#graph-canvas,#mouse-canvas{position:fixed;inset:0;width:100%;height:100%}
#graph-canvas{z-index:0;pointer-events:none}
#mouse-canvas{z-index:50;pointer-events:none}

/* SCENE CONTENTS */
.scene-content{position:relative;z-index:10;width:100%;padding:1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center}

/* ENTRY */
#name-block{position:absolute;z-index:2;text-align:center;pointer-events:none;user-select:none;will-change:transform,opacity;transition:transform .05s linear,opacity .05s linear}
#name-text{font-family:'Space Grotesk',sans-serif;font-size:clamp(2.8rem,8vw,7.5rem);font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(135deg,#F0F4FF 0%,#C4B5FD 45%,#67E8F9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
#entry-overlay{position:absolute;inset:0;transition:background .08s linear;z-index:1}
#narrative{position:relative;z-index:3;text-align:center;padding:1.5rem;opacity:0;transition:opacity .15s linear}
.eyebrow{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.2em;color:var(--accent-light);margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.dot-pulse{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block;animation:pdot 2s infinite}
#line1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.6rem,4vw,3rem);font-weight:700;line-height:1.1;color:var(--text);margin-bottom:.4rem;min-height:1.2em}
#line2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.6rem,4vw,3rem);font-weight:700;line-height:1.1;margin-bottom:1.25rem;min-height:1.2em;background:linear-gradient(90deg,#9F67FF,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#line3{font-family:'Space Grotesk',sans-serif;color:var(--muted);font-size:clamp(.9rem,2vw,1.25rem);margin-bottom:2rem;opacity:0;transition:opacity .4s}
#scroll-hint{color:var(--dim);font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;opacity:0;transition:opacity .4s}
.cursor{border-right:2px solid #9F67FF;margin-left:1px;animation:blink 1s step-end infinite}

/* PROBLEMS */
#prob-content{max-width:600px}
#prob-content h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.1rem,3vw,2rem);font-weight:700;color:var(--text);margin-bottom:1.75rem}
.prob-item{display:flex;align-items:center;gap:1rem;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);border-radius:10px;padding:.85rem 1.25rem;backdrop-filter:blur(8px);opacity:0;transform:translateX(-40px);transition:all .5s ease;margin-bottom:.85rem}
.prob-item.show{opacity:1;transform:translateX(0)}
.prob-icon{font-size:1.1rem;flex-shrink:0}
.prob-text{color:var(--muted);font-size:clamp(.82rem,2vw,.9rem);text-align:left}
#prob-end{margin-top:2rem;font-family:'Space Grotesk',sans-serif;font-size:clamp(.95rem,2.5vw,1.5rem);color:var(--accent-light);opacity:0;transform:scale(.95) translateY(20px);transition:all .5s ease}
#prob-end.show{opacity:1;transform:scale(1) translateY(0)}

/* TRANSFORMATION */
#trans-content h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.4rem,4vw,2.8rem);font-weight:700;margin-bottom:2.5rem;line-height:1.15}
#trans-content h2 span.grad{background:linear-gradient(90deg,#9F67FF,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;max-width:460px;margin:0 auto 2rem}
.stat-item{text-align:center}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);font-weight:700;background:linear-gradient(135deg,#9F67FF,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.stat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.35rem;max-width:110px;margin:0 auto}
.tools-row{display:flex;justify-content:center;gap:.45rem;flex-wrap:wrap;animation:fadeup .5s ease}
.tool-tag{background:rgba(124,58,237,.07);border:1px solid var(--border);border-radius:6px;padding:.22rem .65rem;font-size:.65rem;color:var(--dim);backdrop-filter:blur(8px)}

/* PRODUCTS */
#prod-content h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1rem,2.5vw,1.7rem);font-weight:700;color:var(--text);margin-bottom:2.25rem}
.prod-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;justify-items:center;position:relative;max-width:580px;width:100%}
.prod-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:.55rem;cursor:default;padding:.75rem .5rem 1rem;opacity:0;transform:scale(.7) translateY(24px);transition:all .55s cubic-bezier(.34,1.56,.64,1)}
.prod-card.show{opacity:1;transform:scale(1) translateY(0)}
.prod-icon{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;border:2px solid;transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.prod-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.prod-short{font-size:.62rem;color:var(--muted);text-align:center;line-height:1.4;max-width:110px;transition:opacity .22s ease}
.prod-panel{position:absolute;bottom:0;left:50%;width:170px;background:rgba(2,4,8,.96);border-radius:12px;padding:.85rem;z-index:20;backdrop-filter:blur(14px);pointer-events:none;opacity:0;transform:translateX(-50%) translateY(10px);transition:all .28s ease}
.prod-panel h4{font-family:'Space Grotesk',sans-serif;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.prod-panel p{font-size:.62rem;color:var(--muted);line-height:1.55;margin-bottom:.5rem}
.prod-result{display:flex;align-items:center;gap:.35rem;font-size:.62rem;font-weight:600;padding-top:.4rem;border-top:1px solid rgba(255,255,255,.06)}
.prod-result-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.prod-tech{font-size:.55rem;color:var(--dim);margin-top:.3rem}
.prod-card:hover .prod-icon{transform:scale(1.15) translateY(-6px)}
.prod-card:hover .prod-short{opacity:0}
.prod-card:hover .prod-panel{opacity:1;transform:translateX(-50%) translateY(0)}
.prod-hint{display:inline-flex;align-items:center;gap:.4rem;background:rgba(124,58,237,.06);border:1px solid var(--border);border-radius:999px;padding:.28rem .9rem;font-size:.62rem;color:var(--dim);margin-top:2rem;opacity:0;transition:opacity .4s}

/* CHAT */
#chat-content{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2.5rem;align-items:center;max-width:720px;width:100%}
#chat-copy h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.2rem,3vw,2rem);font-weight:700;color:var(--text);margin-bottom:1rem}
#chat-copy p{color:var(--muted);line-height:1.75;font-size:.88rem;margin-bottom:1.25rem}
.check-item{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--muted);margin-bottom:.45rem;opacity:0;transition:opacity .3s ease}
.check-item.show{opacity:1}
.check-icon{color:var(--green);font-weight:700}
.chat-win{background:rgba(2,4,8,.95);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.chat-hdr{display:flex;align-items:center;gap:.5rem;padding:.65rem 1rem;border-bottom:1px solid var(--border);font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.status-dot{width:7px;height:7px;background:var(--green);border-radius:50%;animation:pdot 2s infinite}
.chat-body{padding:.85rem;display:flex;flex-direction:column;gap:.5rem;min-height:170px}
.msg{border-radius:10px;padding:.45rem .8rem;font-size:.78rem;max-width:88%;line-height:1.5;animation:fadeup .4s ease}
.msg.user{align-self:flex-end;background:rgba(124,58,237,.18);border:1px solid rgba(124,58,237,.3);color:var(--accent-light)}
.msg.ai{align-self:flex-start;background:rgba(6,12,20,.9);border:1px solid var(--border);color:var(--muted)}
.typing{align-self:flex-start;display:flex;gap:4px;padding:.45rem .8rem;background:rgba(6,12,20,.9);border:1px solid var(--border);border-radius:10px}
.typing span{width:5px;height:5px;background:var(--accent-mid);border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}

/* CTA */
#cta-content{max-width:480px;width:100%}
#cta-content h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.4rem,3.5vw,2.4rem);font-weight:700;color:var(--text);margin-bottom:.65rem}
#cta-content > p{color:var(--muted);margin-bottom:1.75rem;line-height:1.7;font-size:.92rem}
.form-box{background:rgba(2,4,8,.88);border:1px solid var(--border);border-radius:16px;padding:1.75rem;display:grid;gap:.85rem;backdrop-filter:blur(16px)}
.field{display:flex;flex-direction:column;gap:.28rem;text-align:left}
.field label{font-size:.75rem;color:var(--muted);font-weight:500}
.field input,.field select{width:100%;padding:.75rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s;appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.field select{cursor:pointer;color:var(--dim)}
.field select.has-value{color:var(--text)}
#submit-btn{width:100%;padding:.88rem;background:rgba(124,58,237,.2);color:#fff;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.88rem;text-transform:uppercase;letter-spacing:.06em;cursor:not-allowed;transition:all .2s}
#submit-btn.ready{background:linear-gradient(135deg,#7C3AED,#9F67FF);cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.4)}
.form-disc{font-size:.65rem;color:var(--dim);text-align:center}
.success-box{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:16px;padding:2.5rem;display:flex;flex-direction:column;align-items:center;gap:1rem;backdrop-filter:blur(12px);display:none}
.success-box h3{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;text-transform:uppercase;color:var(--text)}
.success-box p{color:var(--muted);font-size:.88rem}

/* FOOTER */
footer{position:relative;z-index:10;text-align:center;padding:1.25rem;font-size:.7rem;color:var(--dim);background:var(--bg);border-top:1px solid var(--border)}

/* SCENE FADE */
.scene-inner{opacity:0;transition:opacity .6s ease,transform .6s ease}
.scene-inner.show{opacity:1}
.scene-inner.from-bottom{transform:translateY(30px)}
.scene-inner.show.from-bottom{transform:translateY(0)}
.scene-inner.from-scale{transform:scale(.95)}
.scene-inner.show.from-scale{transform:scale(1)}

/* ANIMATIONS */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pdot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-5px);opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<canvas id="graph-canvas" aria-hidden="true"></canvas>
<canvas id="mouse-canvas" aria-hidden="true"></canvas>
<div id="progress-bar"></div>

<!-- HEADER: only lang switcher -->
<header id="header">
  <button class="lang-btn active" onclick="setLang('pt')" id="btn-pt">🇧🇷 PT</button>
  <button class="lang-btn" onclick="setLang('en')" id="btn-en">🇺🇸 EN</button>
</header>

<div id="scroll-root">

  <!-- SCENE 1: ENTRY (250vh) -->
  <div class="scene-track tall">
    <div class="scene-sticky" id="scene-entry">
      <div id="entry-overlay"></div>
      <!-- Big name -->
      <div id="name-block">
        <div id="name-text">SYNAPTECH</div>
      </div>
      <!-- Narrative -->
      <div id="narrative" class="scene-content">
        <div class="eyebrow">
          <span class="dot-pulse"></span>
          <span id="active-label">Sistemas Ativos</span>
        </div>
        <div id="line1"></div>
        <div id="line2"></div>
        <p id="line3"></p>
        <div id="scroll-hint"></div>
      </div>
    </div>
  </div>

  <!-- SCENE 2: PROBLEM (200vh) -->
  <div class="scene-track">
    <div class="scene-sticky">
      <div class="scene-inner from-bottom" id="prob-inner">
        <div class="scene-content" id="prob-content">
          <h2 id="prob-title"></h2>
          <div id="prob-items"></div>
          <div id="prob-end"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE 3: TRANSFORMATION (200vh) -->
  <div class="scene-track">
    <div class="scene-sticky">
      <div class="scene-inner from-scale" id="trans-inner">
        <div class="scene-content" id="trans-content">
          <h2><span id="trans-line1"></span><br><span class="grad" id="trans-line2"></span></h2>
          <div class="stats-grid">
            <div class="stat-item"><div class="stat-num" id="s1">0</div><div class="stat-lbl" id="s1l"></div></div>
            <div class="stat-item"><div class="stat-num" id="s2">0</div><div class="stat-lbl" id="s2l"></div></div>
            <div class="stat-item"><div class="stat-num" id="s3">0</div><div class="stat-lbl" id="s3l"></div></div>
          </div>
          <div class="tools-row" id="tools-row" style="display:none">
            <span class="tool-tag">n8n</span><span class="tool-tag">Claude AI</span><span class="tool-tag">OpenAI</span><span class="tool-tag">WhatsApp API</span><span class="tool-tag">Supabase</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE 4: PRODUCTS (200vh) -->
  <div class="scene-track">
    <div class="scene-sticky">
      <div class="scene-inner" id="prod-inner">
        <div class="scene-content" id="prod-content">
          <h2 id="prod-title"></h2>
          <div class="prod-grid" id="prod-grid"></div>
          <div class="prod-hint" id="prod-hint"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE 5: CHAT (200vh) -->
  <div class="scene-track">
    <div class="scene-sticky">
      <div class="scene-inner from-bottom" id="chat-inner">
        <div class="scene-content" style="padding:1.5rem">
          <div id="chat-content">
            <div id="chat-copy">
              <h2 id="chat-title"></h2>
              <p id="chat-desc"></p>
              <div id="chat-checks"></div>
            </div>
            <div class="chat-win">
              <div class="chat-hdr">
                <span class="status-dot"></span>
                <span id="chat-hdr-text">ClinicBot · Online</span>
              </div>
              <div class="chat-body" id="chat-body"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCENE 6: CTA (250vh) -->
  <div class="scene-track tall">
    <div class="scene-sticky">
      <div class="scene-inner from-bottom" id="cta-inner">
        <div class="scene-content" id="cta-content">
          <h2 id="cta-title"></h2>
          <p id="cta-sub"></p>
          <div class="form-box" id="form-box">
            <div class="field">
              <label id="lbl-name"></label>
              <input type="text" id="inp-name" placeholder="">
            </div>
            <div class="field">
              <label id="lbl-wpp"></label>
              <input type="tel" id="inp-wpp" placeholder="+55 11 99999-9999">
            </div>
            <div class="field">
              <label id="lbl-need"></label>
              <select id="inp-need" onchange="this.classList.add('has-value')">
                <option value=""></option>
              </select>
            </div>
            <button type="button" id="submit-btn" onclick="submitForm()"></button>
            <div class="form-disc" id="form-disc"></div>
          </div>
          <div class="success-box" id="success-box">
            <div style="font-size:2.5rem">✅</div>
            <h3 id="suc-title"></h3>
            <p id="suc-sub"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p id="footer-txt"></p>
  </footer>
</div>

<script>

// TRANSLATIONS
// ══════════════════════════════════

    fn:"Nome *",fw:"WhatsApp *",fq:"O que você precisa?",fsel:"Selecione",
    opts:["🤖 Agente de WhatsApp","⚙️ Automação de processo","🔗 Integração de sistemas","📊 Inteligência de dados","💡 Quero conversar"],
    fbtn:"Quero uma Proposta Gratuita",
    ot:"Recebido.",

let chatStep = 0, chatTimer = null;
function rebuildChat() {
  const body = document.getElementById('chat-body');

}
function advanceChat() {
  const body = document.getElementById('chat-body');
  const msgs = [{u:true,text:t.cm1},{u:false,text:t.cr1},{u:true,text:t.cm2},{u:false,text:t.cr2}];
  const typing = body.querySelector('.typing');
  if (typing) typing.remove();
  if (chatStep < msgs.length) {
    const m = msgs[chatStep];
    const el = document.createElement('div');
    el.className = 'msg ' + (m.u?'user':'ai');
    el.textContent = m.text;
    body.appendChild(el);
    chatStep++;
    if (chatStep < msgs.length) {
      const t2 = document.createElement('div');
      t2.className = 'typing';
      t2.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(t2);
      chatTimer = setTimeout(advanceChat, 1800);
    }
  }
}

(function initGraph(){
  const canvas = document.getElementById('graph-canvas');
  const ctx = canvas.getContext('2d');
  const rnd = (a,b) => a+Math.random()*(b-a);
  let W,H,nodes=[],pulses=[];

  function init(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    const A={r:159,g:103,b:255},Cy={r:6,g:182,b:212},G={r:80,g:100,b:140};
    nodes=Array.from({length:55},(_,i)=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,
      r:rnd(2,i<8?13:4.5),pulse:Math.random()*Math.PI*2,ps:rnd(.015,.032),
      col:i%3===0?Cy:i%5===0?G:A,hub:i<8
    }));
    pulses=[];
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    const hubs=nodes.filter(n=>n.hub),sats=nodes.filter(n=>!n.hub);
    const hd=Math.min(W,H)*.6,sd=Math.min(W,H)*.28;
    for(let i=0;i<hubs.length;i++)for(let j=i+1;j<hubs.length;j++){
      const dx=hubs[i].x-hubs[j].x,dy=hubs[i].y-hubs[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<hd){
        const c=hubs[i].col;
        ctx.beginPath();ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${(1-d/hd)*.6})`;ctx.lineWidth=1.2;
        ctx.moveTo(hubs[i].x,hubs[i].y);ctx.lineTo(hubs[j].x,hubs[j].y);ctx.stroke();
        if(Math.random()<.003)pulses.push({from:hubs[i],to:hubs[j],t:0,sp:rnd(.006,.013)});
      }
    }
    for(const p of sats)for(const h of hubs){
      const dx=p.x-h.x,dy=p.y-h.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<sd){const c=h.col;ctx.beginPath();ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${(1-d/sd)*.22})`;ctx.lineWidth=.5;ctx.moveTo(p.x,p.y);ctx.lineTo(h.x,h.y);ctx.stroke();}
    }
    const alive=[];
    for(const pu of pulses){
      pu.t+=pu.sp;if(pu.t>=1)continue;alive.push(pu);
      const px=pu.from.x+(pu.to.x-pu.from.x)*pu.t,py=pu.from.y+(pu.to.y-pu.from.y)*pu.t,c=pu.from.col;
      const g=ctx.createRadialGradient(px,py,0,px,py,6);g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},.9)`);g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
      ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    }
    pulses=alive;
    for(const n of nodes){
      n.pulse+=n.ps;const gw=(Math.sin(n.pulse)+1)/2,c=n.col;
      if(n.hub){
        const oR=n.r*(1.7+gw*.5);
        const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,oR*2);g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},.18)`);g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
        ctx.beginPath();ctx.arc(n.x,n.y,oR*2,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
        const core=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);core.addColorStop(0,'rgba(255,255,255,.95)');core.addColorStop(.45,`rgba(${c.r},${c.g},${c.b},.9)`);core.addColorStop(1,`rgba(${c.r},${c.g},${c.b},.55)`);
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=core;ctx.fill();
      }else{
        const g2=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*3.5);g2.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${.45+gw*.3})`);g2.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
        ctx.beginPath();ctx.arc(n.x,n.y,n.r*3.5,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
        ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fillStyle=`rgba(${c.r},${c.g},${c.b},${.65+gw*.3})`;ctx.fill();
      }
      n.x+=n.vx;n.y+=n.vy;const pad=n.r*2;if(n.x<pad||n.x>W-pad)n.vx*=-1;if(n.y<pad||n.y>H-pad)n.vy*=-1;
    }
    requestAnimationFrame(draw);
  }
  init();draw();
  window.addEventListener('resize',init);
})();

(function initMouse(){
  if(window.innerWidth<768)return;
  const canvas=document.getElementById('mouse-canvas');
  const ctx=canvas.getContext('2d');
  let mpos={x:-200,y:-200},cur={x:-200,y:-200},trail=[];
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
  window.addEventListener('mousemove',e=>{mpos={x:e.clientX,y:e.clientY};});
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    cur.x+=(mpos.x-cur.x)*.1;cur.y+=(mpos.y-cur.y)*.1;
    trail.push({...cur,age:0});if(trail.length>22)trail.shift();trail.forEach(p=>p.age++);
    trail.forEach(p=>{
      const a=(1-p.age/22)*.28,r=(1-p.age/22)*3;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*5);g.addColorStop(0,`rgba(159,103,255,${a})`);g.addColorStop(1,'rgba(159,103,255,0)');
      ctx.beginPath();ctx.arc(p.x,p.y,r*5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    });
    const {x,y}=cur,tn=Date.now()*.003;
    const glow=ctx.createRadialGradient(x,y,0,x,y,20);glow.addColorStop(0,'rgba(159,103,255,.28)');glow.addColorStop(1,'rgba(159,103,255,0)');
    ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();
    ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='rgba(196,181,253,.9)';ctx.fill();
    const rr=10+Math.sin(tn)*4;ctx.beginPath();ctx.arc(x,y,rr,0,Math.PI*2);ctx.strokeStyle=`rgba(124,58,237,${.3+Math.sin(tn)*.15})`;ctx.lineWidth=1;ctx.stroke();
    requestAnimationFrame(draw);
  }
  draw();
})();

const root = document.getElementById('scroll-root');
const vh = () => window.innerHeight;

// Typewriter
function typewrite(el, text, speed, cb) {
  el.innerHTML='';let i=0,cursor=document.createElement('span');cursor.className='cursor';cursor.innerHTML='&nbsp;';el.appendChild(cursor);
  const id=setInterval(()=>{
    el.insertBefore(document.createTextNode(text[i++]),cursor);
    if(i>=text.length){clearInterval(id);cursor.remove();cb&&cb();}
  },speed);
  return id;
}

// Stat counters
let countersDone=false, countersStarted=false;
function startCounters(){
  if(countersStarted)return;countersStarted=true;
  const targets=[t.s1,t.s2,t.s3];
  const ids=['s1','s2','s3'];
  ids.forEach((id,i)=>{
    const el=document.getElementById(id);
    const raw=targets[i];
    const isNum=raw.replace(/[^0-9]/g,'');
    if(!isNum){el.textContent=raw;return;}
    const num=parseInt(isNum);const prefix=raw.includes('−')?'−':'';const suffix=raw.replace(/[0-9−]/g,'');
    let v=0;const step=num/35;
    const iv=setInterval(()=>{v+=step;if(v>=num){el.textContent=prefix+num+suffix;clearInterval(iv);}else el.textContent=prefix+Math.floor(v)+suffix;},28);
  });
}

// Typewriter state
let twState={l1done:false,l2done:false,l1id:null,l2id:null};
function resetTypewriters(){
  clearInterval(twState.l1id);clearInterval(twState.l2id);
  document.getElementById('line1').innerHTML='';document.getElementById('line2').innerHTML='';
  twState={l1done:false,l2done:false,l1id:null,l2id:null};
}

let lastSY=-1;
root.addEventListener('scroll',onScroll,{passive:true});
function onScroll(){
  const sy=root.scrollTop;
  if(sy===lastSY)return;lastSY=sy;
  const total=root.scrollHeight-root.clientHeight;
  const prog=total>0?sy/total:0;
  document.getElementById('progress-bar').style.width=prog*100+'%';

  const VH=vh();
  const sL=(a,b)=>Math.min(1,Math.max(0,(sy-a*VH)/((b-a)*VH)));

  const eP=sL(0,2.5);
  const prP=sL(2.5,4.5);
  const trP=sL(4.5,6.5);
  const prD=sL(6.5,8.5);
  const chP=sL(8.5,10.5);
  const ctP=sL(10.5,12.5);

  // Header
  const hdrVis=sy<50||ctP>.05;
  document.getElementById('header').style.transform=hdrVis?'translateY(0)':'translateY(-100%)';

  // ── SCENE 1: ENTRY ──
  const nameScale=1+eP*2.8;
  const nameOp=Math.max(0,1-eP*2.2);
  const graphOp=Math.max(0.06,1-eP*1.6);
  document.getElementById('graph-canvas').style.opacity=graphOp;
  const nb=document.getElementById('name-block');
  nb.style.transform=`scale(${nameScale})`;nb.style.opacity=nameOp;
  document.getElementById('entry-overlay').style.background=`radial-gradient(ellipse 60% 55% at 50% 50%,rgba(2,4,8,.05) 0%,rgba(2,4,8,${.1+eP*.78}) 100%)`;

  const narr=document.getElementById('narrative');
  const narrOp=Math.min(1,Math.max(0,(eP-.28)*4));
  narr.style.opacity=narrOp;

  if(eP>.3&&!twState.l1done&&!twState.l1id){
    twState.l1id=typewrite(document.getElementById('line1'),t.e1,42,()=>{twState.l1done=true;});
  }
  if(eP>.55&&twState.l1done&&!twState.l2done&&!twState.l2id){
    twState.l2id=typewrite(document.getElementById('line2'),t.e2,40,()=>{twState.l2done=true;});
  }
  if(eP<=.25&&twState.l1id){resetTypewriters();}
  document.getElementById('line3').style.opacity=eP>.78?1:0;
  if(!document.getElementById('line3').dataset.set){document.getElementById('line3').textContent=t.e3;document.getElementById('line3').dataset.set='1';}
  document.getElementById('scroll-hint').style.opacity=eP>.9?1:0;
  if(!document.getElementById('scroll-hint').dataset.set){document.getElementById('scroll-hint').textContent=t.scroll;document.getElementById('scroll-hint').dataset.set='1';}

  // ── SCENE 2: PROBLEMS ──
  const pi=document.getElementById('prob-inner');
  if(prP>.05){pi.classList.add('show','from-bottom');}else{pi.classList.remove('show');}
  document.querySelectorAll('.prob-item').forEach((el,i)=>{
    el.classList.toggle('show',prP>(i+1)*.22);
    el.style.transitionDelay=i*.1+'s';
  });
  document.getElementById('prob-end').classList.toggle('show',prP>.88);

  // ── SCENE 3: TRANSFORMATION ──
  const ti=document.getElementById('trans-inner');
  if(trP>.05){ti.classList.add('show','from-scale');}else{ti.classList.remove('show');countersStarted=false;}
  if(trP>.3)startCounters();
  document.getElementById('tools-row').style.display=trP>.65?'flex':'none';

  // ── SCENE 4: PRODUCTS ──
  const pdi=document.getElementById('prod-inner');
  if(prD>.05)pdi.classList.add('show');else pdi.classList.remove('show');
  document.querySelectorAll('.prod-card').forEach((card,i)=>{
    if(prD>.2){setTimeout(()=>card.classList.add('show'),i*180);}else card.classList.remove('show');
  });
  document.getElementById('prod-hint').style.opacity=prD>.6?1:0;

  // ── SCENE 5: CHAT ──
  const chi=document.getElementById('chat-inner');
  if(chP>.05){chi.classList.add('show','from-bottom');}else{chi.classList.remove('show');chatStarted=false;rebuildChat();}
  document.querySelectorAll('.check-item').forEach((el,i)=>{
    el.classList.toggle('show',chP>i*.15);
    el.style.transitionDelay=i*.1+'s';
  });
  if(chP>.25)startChat();

  // ── SCENE 6: CTA ──
  const cti=document.getElementById('cta-inner');
  if(ctP>.05)cti.classList.add('show','from-bottom');else cti.classList.remove('show');
}

function submitForm() {
  const nomeInput = document.getElementById('inp-name');
  const wppInput = document.getElementById('inp-wpp');
  const needInput = document.getElementById('inp-need');
  const btn = document.getElementById('submit-btn');

  const nome = nomeInput.value.trim();
  const wpp = wppInput.value.trim();
  const sol = needInput.value.trim();

  // Validação
  if (!nome || !wpp || !sol) {
    if (!nome) nomeInput.focus();
    else if (!wpp) wppInput.focus();
    else needInput.focus();
    return;
  }

  // Mensagem que será aberta no WhatsApp
  const mensagem =
    `Olá! Me chamo ${nome} e gostaria de saber mais sobre ${sol.toLowerCase()}. Poderiam me ajudar?`;

  const whatsappUrl =
    'https://wa.me/5532987167907?text=' + encodeURIComponent(mensagem);

  // Abre o WhatsApp imediatamente ao clicar.
  // Isso evita bloqueio de popup pelo navegador.
  const whatsappWindow = window.open(whatsappUrl, '_blank');

  // Caso o navegador bloqueie a nova aba, tenta navegar na mesma aba.
  if (!whatsappWindow) {
    window.location.href = whatsappUrl;
  }

  // Envia o lead para o n8n em segundo plano.
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  const leadData = {
    nome: nome,
    whatsapp: wpp,
    solucao: sol,
    origem: 'formulario_final',
    pagina: window.location.href,
    data: new Date().toISOString()
  };

  fetch('https://n8n-yvdu.srv1552695.hstgr.cloud/webhook/synaptech', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(leadData)
  })
  .then(res => {
    if (!res.ok) throw new Error('Erro ' + res.status);

    if (typeof fbq !== 'undefined') {
      fbq('track', 'Lead', {
        content_name: sol
      });
    }

    document.getElementById('form-box').style.display = 'none';
    document.getElementById('success-box').style.display = 'flex';
  })
  .catch(() => {
    // O WhatsApp já foi aberto, então o lead não é perdido.
    document.getElementById('form-box').style.display = 'none';
    document.getElementById('success-box').style.display = 'flex';

    // Retry do n8n
    setTimeout(() => {
      fetch('https://n8n-yvdu.srv1552695.hstgr.cloud/webhook/synaptech', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          ...leadData,
          retry: true
        })
      }).catch(() => {});
    }, 3000);
  });
}

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
applyTranslations();
rebuildProducts();
rebuildChat();
// Trigger once on load
setTimeout(()=>root.dispatchEvent(new Event('scroll')),50);
</script>
